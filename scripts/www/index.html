<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <style>
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="max-w-md mx-auto bg-white shadow-lg">
        <!-- Home Page -->
        <div id="home-page" class="page active">
            <img src="https://p11-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/0f57404fe868419fbd7b9b0872806576.jpg~tplv-a9rns2rl98-24:720:720.image?lk3s=8e244e95&rcl=2026031021564072D137EF0367BD0D6903&rrcfp=8a172a1a&x-expires=1773755800&x-signature=Htww%2Fv3gQvoLaYLjytYdze%2FtZLc%3D" alt="Home" class="w-full">
        </div>

        <!-- Wealth Page -->
        <div id="wealth-page" class="page">
            <img src="https://p26-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/b55b397e2db94b81b5956c3b95654a0d.jpg~tplv-a9rns2rl98-24:720:720.image?lk3s=8e244e95&rcl=2026031021564072D137EF0367BD0D6903&rrcfp=8a172a1a&x-expires=1773755800&x-signature=UoHpivYuUNjtgbShb9yhfJJzwe8%3D" alt="Wealth" class="w-full">
        </div>

        <!-- Credit Card Page -->
        <div id="credit-card-page" class="page">
            <img src="https://p11-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/2c6aff56a5c14454a3805a6f93c5642e.jpg~tplv-a9rns2rl98-24:720:720.image?lk3s=8e244e95&rcl=2026031021564072D137EF0367BD0D6903&rrcfp=8a172a1a&x-expires=1773755800&x-signature=0Qp6NesZou33FWLX0GTraLogaD8%3D" alt="Credit Card" class="w-full">
        </div>

        <!-- Zhongyuan Life Page -->
        <div id="zhongyuan-life-page" class="page">
            <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/4678a8458dc54d94833df7c948ae4a2c.jpg~tplv-a9rns2rl98-24:720:720.image?lk3s=8e244e95&rcl=2026031021564072D137EF0367BD0D6903&rrcfp=8a172a1a&x-expires=1773755800&x-signature=ySwYoH3blcdY4UrAXxE7hIadJvg%3D" alt="Zhongyuan Life" class="w-full">
        </div>

        <!-- My Page -->
        <div id="my-page" class="page">
            <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/46a39a7e95c549078fac141fdf7f104a.jpg~tplv-a9rns2rl98-24:720:720.image?lk3s=8e244e95&rcl=2026031021564072D137EF0367BD0D6903&rrcfp=8a172a1a&x-expires=1773755800&x-signature=LisilgNQ0xgdCXcvrWYrnjegVzQ%3D" alt="My" class="w-full">
        </div>

        <!-- Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-2">
            <a href="#" class="nav-item active" data-page="home-page">
                <i data-lucide="home"></i>
            </a>
            <a href="#" class="nav-item" data-page="wealth-page">
                <i data-lucide="dollar-sign"></i>
            </a>
            <a href="#" class="nav-item" data-page="credit-card-page">
                <i data-lucide="credit-card"></i>
            </a>
            <a href="#" class="nav-item" data-page="zhongyuan-life-page">
                <i data-lucide="heart"></i>
            </a>
            <a href="#" class="nav-item" data-page="my-page">
                <i data-lucide="user"></i>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();

        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();

                const pageId = item.dataset.page;

                pages.forEach(page => {
                    page.classList.remove('active');
                });
                document.getElementById(pageId).classList.add('active');

                navItems.forEach(navItem => {
                    navItem.classList.remove('active');
                });
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
